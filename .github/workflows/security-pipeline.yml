name: Security CI Pipeline

on:
  push:
    branches: ["main", "vuln-test"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit & AI security tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest tests/test_app.py -v --junitxml=reports/unit-tests.xml

      - name: Run AI security tests
        run: pytest tests/test_ai_security.py -v --junitxml=reports/ai-tests.xml

      - name: Generate AI security report
        if: always()
        run: python security/generate_ai_report.py

      - name: Display test results
        if: always()
        run: cat reports/ai-security-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn

  security-scans:
    name: SAST, SCA, container & DAST scans
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit semgrep pip-audit

      - name: Prepare reports directory
        run: mkdir -p reports

      # ---------- SAST ----------
      - name: Bandit (SAST)
        continue-on-error: true
        run: |
          bandit -r app/ -f json -o reports/bandit-report.json
          bandit -r app/

      - name: Semgrep custom rules (SAST)
        continue-on-error: true
        run: |
          semgrep scan --config security/semgrep/rules.yml --json --output reports/semgrep-report.json --error app/
          semgrep scan --config security/semgrep/rules.yml app/

      # ---------- Dependency scanning ----------
      - name: pip-audit (dependency scan)
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt -f json -o reports/dependency-report.json
          pip-audit -r requirements.txt

      # ---------- Container ----------
      - name: Build Docker image
        run: docker build -t vulnfinbot:latest .

      - name: Trivy image scan
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             -v "$(pwd)/reports:/out" aquasec/trivy:0.67.2 image --quiet             --format json --output /out/trivy-report.json vulnfinbot:latest
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.67.2 image --quiet --severity CRITICAL,HIGH vulnfinbot:latest

      # ---------- DAST ----------
      - name: Start application container
        run: |
          docker run -d --name vulnfinbot -p 5000:5000 vulnfinbot:latest
          for i in $(seq 1 20); do curl -fs http://localhost:5000/health && break; sleep 1; done

      - name: OWASP ZAP baseline scan (DAST)
        continue-on-error: true
        run: |
          chmod 777 reports
          docker run --rm --network host -v "$(pwd)/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:5000 -J zap-report.json -r zap-report.html -I

      - name: Security summary
        if: always()
        run: python security/summarize_reports.py reports | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop application container
        if: always()
        run: docker rm -f vulnfinbot || true

      - name: Upload all security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnfinbot-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn
